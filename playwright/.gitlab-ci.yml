workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - test
  - deploy

playwright-tests:
  stage: test
  image: mcr.microsoft.com/playwright:v1.56.1-noble
  cache:
    key:
      files:
        - playwright/package-lock.json
    paths:
      - playwright/.npm/
  script:
    - cd playwright
    - npm ci --cache .npm --prefer-offline
    - npx playwright test
  after_script:
    - cd playwright && npm run report:failures || echo "Playwright failure triage report could not be generated"
    - cd playwright && npm run report:kpi || echo "Playwright KPI report could not be generated"
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - playwright/playwright-report/
      - playwright/test-results/
    reports:
      junit: playwright/test-results/playwright-results.xml

pages:
  stage: deploy
  needs:
    - job: playwright-tests
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: always
    - when: never
  script:
    - test -s playwright/public/index.html
  pages:
    publish: playwright/public
  artifacts:
    when: always
    paths:
      - playwright/public/